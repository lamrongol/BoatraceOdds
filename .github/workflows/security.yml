name: security

on:
  push:
    branches:
      - "gh-pages"
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security on PHP ${{ matrix.php-version }} (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php-version:
          - "8.5"
    steps:
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php-version }}

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Composer Audit
        if: hashFiles('**/composer.lock') != ''
        run: composer audit --no-interaction --format=summary

      - name: Skip Audit (no composer files)
        if: hashFiles('**/composer.lock') == ''
        run: echo "No composer.lock found. Skipping composer audit."
